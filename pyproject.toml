[project]
name = "telegram-rag-bot"
version = "0.1.0"
description = "Telegram RAG-бот: ответы на вопросы по загруженным PDF (Qdrant + PostgreSQL + OpenAI)"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "aiogram>=3.13,<4",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "qdrant-client>=1.12,<2",
    "openai>=1.40",
    "pymupdf>=1.24",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
